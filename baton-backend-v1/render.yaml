services:
  - type: web
    name: baton-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: BATON_ACCESS_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,https://baton-sigma-six.vercel.app
